---
- name: Installera iptables-persistent
  apt:
    name: iptables-persistent
    state: present
    update_cache: yes

- name: Aktivera IP-forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Tillåt trafik från client till webserver (port 80)
  iptables:
    chain: FORWARD
    in_interface: enp0s8
    out_interface: enp0s9
    source: 10.0.1.2
    destination: 10.0.4.2
    protocol: tcp
    destination_port: '80'
    jump: ACCEPT

- name: Tillåt trafik från client till webserver (port 443)
  iptables:
    chain: FORWARD
    in_interface: enp0s8
    out_interface: enp0s9
    source: 10.0.1.2
    destination: 10.0.4.2
    protocol: tcp
    destination_port: '443'
    jump: ACCEPT

- name: Tillåt trafik från webserver till databas (port 5432)
  iptables:
    chain: FORWARD
    in_interface: enp0s9
    out_interface: enp0s10
    source: 10.0.4.2
    destination: 10.0.3.2
    protocol: tcp
    destination_port: '5432'
    jump: ACCEPT

- name: Tillåt established/related trafik tillbaka
  iptables:
    chain: FORWARD
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT

- name: Sätt DROP som default policy
  iptables:
    chain: FORWARD
    policy: DROP

- name: Logga dropped paket
  iptables:
    chain: FORWARD
    jump: LOG
    log_prefix: "FW-DROP: "
    log_level: 4

- name: Spara iptables-regler
  command: netfilter-persistent save
  changed_when: false

- name: Kopiera SSH-nycklar automatiskt
  shell: /vagrant/setup_keys.sh
  args:
    executable: /bin/bash
  changed_when: false
