---
- name: Fixa DNS på database
  copy:
    content: "nameserver 8.8.8.8\n"
    dest: /etc/resolv.conf

- name: Installera PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present
    update_cache: yes

- name: Starta och aktivera PostgreSQL
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Konfigurera PostgreSQL att lyssna på rätt IP
  lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '10.0.3.2,localhost'"
  notify: Starta om postgresql

- name: Skapa PostgreSQL-användare och databas
  become: yes
  shell: |
    sudo -u postgres psql -c "CREATE USER webuser WITH PASSWORD 'secret123';" 2>/dev/null || true
    sudo -u postgres psql -c "CREATE DATABASE appdb OWNER webuser;" 2>/dev/null || true
    sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE appdb TO webuser;" 2>/dev/null || true
  changed_when: false

- name: Tillåt anslutning från webbservern i pg_hba.conf
  lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: "host    appdb    webuser    10.0.4.2/32    md5"
    state: present
  notify: Starta om postgresql

- name: Lägg till route via firewall
  command: ip route add 10.0.0.0/8 via 10.0.3.1
  ignore_errors: yes
  changed_when: false
