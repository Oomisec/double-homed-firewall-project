[firewall]
firewall ansible_host=10.0.1.1 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/firewall

[webserver]
webserver ansible_host=10.0.4.2 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/webserver

[database]
database ansible_host=10.0.3.2 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/database

[client]
client ansible_host=10.0.1.2 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/client

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
